# ===========================================================================
# docker-compose.yml — Orquestração completa: App + MySQL + Prometheus +
# Grafana + Graylog + MongoDB + OpenSearch
# Comando único: docker compose up --build
# ===========================================================================

networks:
  bikes-net:
    driver: bridge

volumes:
  mysql-data:
  mongodb-data:
  opensearch-data:
  graylog-data:
  grafana-data:

services:

  # =========================================================================
  # MySQL 8.0 — banco de dados da aplicação
  # =========================================================================
  mysql:
    image: mysql:8.0.39
    container_name: bikes-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: bikes
    command:
      - --innodb-buffer-pool-size=64M
      - --performance-schema=OFF
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - bikes-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 1g

  # =========================================================================
  # MongoDB 6.0 — backend do Graylog
  # =========================================================================
  mongodb:
    image: mongo:6.0.20
    container_name: bikes-mongodb
    restart: unless-stopped
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - mongodb-data:/data/db
    networks:
      - bikes-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 512m

  # =========================================================================
  # OpenSearch 2.15 — indexação de logs do Graylog
  # =========================================================================
  opensearch:
    image: opensearchproject/opensearch:2.15.0
    container_name: bikes-opensearch
    restart: unless-stopped
    environment:
      - cluster.name=bikes-opensearch
      - node.name=opensearch-node
      - discovery.type=single-node
      - bootstrap.memory_lock=false
      - DISABLE_SECURITY_PLUGIN=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    networks:
      - bikes-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s
    # 1.5g: consumo medido em idle ficou em ~908 MB (90% de 1g) — margem para o loadtest
    mem_limit: 1.5g

  # =========================================================================
  # Graylog 6.1.16 — gestão centralizada de logs
  # =========================================================================
  graylog:
    image: graylog/graylog:6.1.16
    container_name: bikes-graylog
    restart: unless-stopped
    environment:
      GRAYLOG_PASSWORD_SECRET: ${GRAYLOG_PASSWORD_SECRET}
      GRAYLOG_ROOT_PASSWORD_SHA2: ${GRAYLOG_ROOT_PASSWORD_SHA2}
      GRAYLOG_HTTP_BIND_ADDRESS: "0.0.0.0:9000"
      GRAYLOG_HTTP_EXTERNAL_URI: "http://127.0.0.1:9000/"
      GRAYLOG_ELASTICSEARCH_HOSTS: "http://opensearch:9200"
      GRAYLOG_MONGODB_URI: "mongodb://mongodb:27017/graylog"
      GRAYLOG_SERVER_JAVA_OPTS: "-Xms512m -Xmx512m"
      # Sem telemetria: evita o pop-up de consentimento e não envia dados de uso para fora
      GRAYLOG_TELEMETRY_ENABLED: "false"
    depends_on:
      mongodb:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    ports:
      - "9000:9000"       # Web UI + API
      - "12201:12201/udp" # GELF UDP Input
    volumes:
      - graylog-data:/usr/share/graylog/data
    networks:
      - bikes-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/api/system/lbstatus || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
    mem_limit: 2g

  # =========================================================================
  # Init container — cria o input GELF UDP via API REST (plano A, idempotente)
  # =========================================================================
  graylog-init:
    image: curlimages/curl:8.11.1
    container_name: bikes-graylog-init
    depends_on:
      graylog:
        condition: service_healthy
    volumes:
      - ./graylog/init-gelf-input.sh:/init-gelf-input.sh:ro
    entrypoint: ["/bin/sh", "/init-gelf-input.sh"]
    environment:
      GRAYLOG_API: "http://graylog:9000/api"
      GRAYLOG_USER: "admin"
      GRAYLOG_PASS: "admin"
    networks:
      - bikes-net
    restart: "no"

  # =========================================================================
  # Aplicação Spring Boot (Bikes)
  # =========================================================================
  app:
    build: .
    container_name: bikes-app
    hostname: bikes-app   # vira o campo "source" das mensagens no Graylog
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASS: ${MYSQL_ROOT_PASSWORD}
      GRAYLOG_HOST: graylog
      GRAYLOG_PORT: "12201"
      APP_ENV: docker
    depends_on:
      mysql:
        condition: service_healthy
      graylog-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    networks:
      - bikes-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    mem_limit: 1g

  # =========================================================================
  # Prometheus — monitoramento de métricas
  # =========================================================================
  prometheus:
    image: prom/prometheus:v3.4.1
    container_name: bikes-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - bikes-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 256m

  # =========================================================================
  # Grafana — dashboards de observabilidade
  # =========================================================================
  grafana:
    image: grafana/grafana:11.6.0
    container_name: bikes-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    depends_on:
      prometheus:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards/dashboard.yml:/etc/grafana/provisioning/dashboards/dashboard.yml:ro
      - ./grafana/provisioning/dashboards/jvm-spring.json:/var/lib/grafana/dashboards/jvm-spring.json:ro
    networks:
      - bikes-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    mem_limit: 256m

  # =========================================================================
  # k6 — geração de carga (perfil: loadtest)
  # Uso: docker compose --profile loadtest up loadtest
  # =========================================================================
  loadtest:
    image: grafana/k6:0.56.0
    container_name: bikes-loadtest
    profiles:
      - loadtest
    volumes:
      - ./loadtest:/scripts:ro
    entrypoint: ["k6", "run", "/scripts/script.js"]
    environment:
      BASE_URL: "http://app:8080"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - bikes-net
    mem_limit: 256m
