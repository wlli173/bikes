spring.application.name=bikes
# LOCALE config
spring.web.locale-resolver=fixed
spring.web.locale=pt_BR

# MYSQL Config — placeholders permitem override via variável de ambiente no Docker
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/bikes?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:root}

# JPA
# exibe sql no log
spring.jpa.show-sql=true 
# exibe em uma única linha
spring.jpa.properties.hibernate.format_sql=false
# cria as tabelas a partir das classes entidades
spring.jpa.hibernate.ddl-auto=update

# H2 Console desabilitado em runtime (segurança — DevSecOps)
spring.h2.console.enabled=false

# ========================
# Actuator / Prometheus
# ========================
management.endpoints.web.exposure.include=health,prometheus,info
management.endpoint.health.show-details=always
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# ========================
# Logging — níveis para evidência no Graylog
# ========================
logging.level.br.edu.ifc.bikes=DEBUG