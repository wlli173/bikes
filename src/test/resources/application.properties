# Perfil de testes: H2 em memória para a esteira de CI não depender do MySQL.
spring.datasource.url=jdbc:h2:mem:bikes;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Mesma exposição do Actuator usada em produção, para validar /actuator/prometheus nos testes.
management.endpoints.web.exposure.include=health,prometheus,info
management.metrics.distribution.percentiles-histogram.http.server.requests=true
