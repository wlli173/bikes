# Perfil de testes: H2 em memória para a esteira de CI não depender do MySQL.
spring.datasource.url=jdbc:h2:mem:bikes;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Mesma exposição do Actuator usada em produção, para validar /actuator/prometheus nos testes.
management.endpoints.web.exposure.include=health,prometheus,info
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Mesmos caminhos do Swagger usados em produção, para validar a documentação OpenAPI nos testes.
springdoc.swagger-ui.path=/docs-bikes.html
springdoc.api-docs.path=/docs-bikes
springdoc.packages-to-scan=br.edu.ifc.bikes.web.controller
# Tags em ordem alfabética: Autenticacao aparece primeiro, na ordem do passo a passo do README
springdoc.swagger-ui.tagsSorter=alpha
