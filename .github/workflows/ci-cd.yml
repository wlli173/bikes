name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Evita execuções duplicadas da mesma branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Menor privilégio por padrão; cada job eleva só o que precisa
permissions:
  contents: read

env:
  REGISTRY: ghcr.io

# Actions fixadas por SHA de commit (proteção contra tags reescritas — supply chain)
jobs:
  compile-and-test:
    name: Compilação e Testes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Java 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Compilar e executar testes
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      - name: Resumo dos testes
        if: always()
        run: |
          {
            echo "### Testes (Surefire)"
            echo '```'
            grep -h "Tests run" target/surefire-reports/*.txt 2>/dev/null || echo "Sem relatórios"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar relatórios de teste
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  build-scan-publish:
    name: Build, Scan e Publicação da Imagem
    needs: compile-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: write
    env:
      # PRs vindos de forks não têm permissão de escrita no GHCR: apenas build + scan
      PUSH_IMAGE: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Normalizar nome da imagem
        id: image
        run: echo "name=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Metadados da imagem
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=pr

      - name: Build da Imagem Docker (Multistage)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          # bikes:ci é a tag local usada nas verificações e no scan (não é publicada)
          tags: |
            ${{ steps.meta.outputs.tags }}
            bikes:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verificar runtime enxuto (sem JDK/Maven)
        run: |
          docker image ls bikes:ci
          if docker run --rm --entrypoint sh bikes:ci -c 'command -v javac || command -v mvn'; then
            echo "::error::Imagem final contém ferramentas de build (javac/mvn)"; exit 1
          fi
          echo "OK: imagem final contém apenas o JRE"

      - name: Scan de vulnerabilidades (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: bikes:ci
          format: table
          output: trivy-report.txt
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # Relatório informativo: não bloqueia a esteira por CVEs de terceiros
          exit-code: "0"

      - name: Resumo do scan
        if: always()
        run: |
          {
            echo "### Trivy — vulnerabilidades HIGH/CRITICAL com correção disponível"
            echo '```'
            cat trivy-report.txt 2>/dev/null || echo "Relatório indisponível"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar relatório do Trivy
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-report
          path: trivy-report.txt
          retention-days: 7

      - name: Login no GHCR
        if: env.PUSH_IMAGE == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicação (Push)
        if: env.PUSH_IMAGE == 'true'
        run: |
          docker push --all-tags "${{ steps.image.outputs.name }}"
          {
            echo "### Imagem publicada"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
