# Esteira CI/CD equivalente à GitHub Actions: testes, build da imagem e push.
stages:
  - test
  - build
  - publish

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  IMAGE: "$CI_REGISTRY_IMAGE"
  IMAGE_SHA: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "master"

.docker:
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_CERT_PATH: "/certs/client"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_BUILDKIT: "1"

compile-and-test:
  stage: test
  image: maven:3.9.16-eclipse-temurin-25
  interruptible: true
  cache:
    key: maven-${CI_COMMIT_REF_SLUG}
    paths:
      - .m2/repository
  script:
    - mvn -B test -DfailIfNoTests=false
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit:
        - target/surefire-reports/TEST-*.xml

build-image:
  extends: .docker
  stage: build
  interruptible: true
  needs:
    - compile-and-test
  script:
    - docker build -t "$IMAGE_SHA" .

publish:
  extends: .docker
  stage: publish
  needs:
    - build-image
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build -t "$IMAGE_SHA" .
    - docker push "$IMAGE_SHA"
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ] || [ "$CI_COMMIT_BRANCH" = "master" ]; then
        docker tag "$IMAGE_SHA" "$IMAGE:latest"
        docker push "$IMAGE:latest"
      fi
    - |
      if [ -n "${CI_MERGE_REQUEST_IID:-}" ]; then
        docker tag "$IMAGE_SHA" "$IMAGE:pr-${CI_MERGE_REQUEST_IID}"
        docker push "$IMAGE:pr-${CI_MERGE_REQUEST_IID}"
      fi
